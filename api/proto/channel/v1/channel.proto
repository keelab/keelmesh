syntax = "proto3";

package channel.v1;

option go_package = "github.com/keelab/keelmesh/gen/channel/v1;channelv1";

service ChannelService {
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  rpc GetChannel(GetChannelRequest) returns (GetChannelResponse);
  rpc ProbeChannel(ProbeChannelRequest) returns (ProbeChannelResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse);
  rpc PrepareInbound(PrepareInboundRequest) returns (PrepareInboundResponse);
  rpc SendMedia(SendMediaRequest) returns (SendMediaResponse);
  rpc GetDeliveryStatus(GetDeliveryStatusRequest) returns (GetDeliveryStatusResponse);
  rpc EditMessage(EditMessageRequest) returns (EditMessageResponse);
  rpc SendPlaceholder(SendPlaceholderRequest) returns (SendPlaceholderResponse);
  rpc StartTyping(StartTypingRequest) returns (StartTypingResponse);
  rpc StopTyping(StopTypingRequest) returns (StopTypingResponse);
  rpc ReactToMessage(ReactToMessageRequest) returns (ReactToMessageResponse);
  rpc CompleteReaction(ReactionActionRequest) returns (ReactionActionResponse);
  rpc ExpireReaction(ReactionActionRequest) returns (ReactionActionResponse);
  rpc StartStreamingMessage(StartStreamingMessageRequest) returns (StartStreamingMessageResponse);
  rpc UpdateStreamingMessage(UpdateStreamingMessageRequest) returns (UpdateStreamingMessageResponse);
  rpc FinishStreamingMessage(FinishStreamingMessageRequest) returns (FinishStreamingMessageResponse);
  rpc UploadMedia(UploadMediaRequest) returns (UploadMediaResponse);
  rpc DownloadMedia(DownloadMediaRequest) returns (DownloadMediaResponse);
  rpc ReleaseMedia(ReleaseMediaRequest) returns (ReleaseMediaResponse);
  rpc RegisterCommands(RegisterCommandsRequest) returns (RegisterCommandsResponse);
  rpc SubscribeInbound(SubscribeInboundRequest) returns (stream SubscribeInboundResponse);
}

message ListChannelsRequest {}

message ListChannelsResponse {
  repeated ChannelInfo channels = 1;
}

message GetChannelRequest {
  string channel_id = 1;
}

message GetChannelResponse {
  ChannelInfo channel = 1;
}

message ProbeChannelRequest {
  string channel_id = 1;
}

message ProbeChannelResponse {
  ChannelInfo channel = 1;
  string status = 2;
  int64 latency_ms = 3;
}

message ChannelInfo {
  string id = 1;
  string kind = 2;
  bool enabled = 3;
  bool running = 4;
  repeated string capabilities = 5;
  string state = 6;
  bool configured = 7;
  string health_status = 8;
  string health_message = 9;
}

message SendMessageRequest {
  string channel_id = 1;
  string target_id = 2;
  string reply_to_message_id = 3;
  string content = 4;
  map<string, string> metadata = 5;
  string idempotency_key = 6;
}

message SendMessageResponse {
  string channel_id = 1;
  string message_id = 2;
  int64 accepted_at_ms = 3;
  string state = 4;
}

message SendNotificationRequest {
  string channel_id = 1;
  string target_id = 2;
  string content = 3;
  map<string, string> metadata = 4;
  repeated string mention_ids = 5;
  bool mention_all = 6;
  string urgency = 7;
  string idempotency_key = 8;
}

message SendNotificationResponse {
  string channel_id = 1;
  string message_id = 2;
  int64 accepted_at_ms = 3;
  string state = 4;
  repeated string invalid_mention_ids = 5;
}

message PrepareInboundRequest {
  string channel_id = 1;
  string target_id = 2;
  string message_id = 3;
  string reply_to_message_id = 4;
  string placeholder_content = 5;
  string reaction = 6;
}

message PrepareInboundResponse {
  string typing_action_id = 1;
  string reaction_action_id = 2;
  string placeholder_message_id = 3;
}

message SendMediaRequest {
  string channel_id = 1;
  string target_id = 2;
  repeated MediaPart parts = 3;
  map<string, string> metadata = 4;
  string idempotency_key = 5;
}

message SendMediaResponse {
  string channel_id = 1;
  string message_id = 2;
  int64 accepted_at_ms = 3;
  string state = 4;
}

message GetDeliveryStatusRequest {
  string message_id = 1;
}

message GetDeliveryStatusResponse {
  string message_id = 1;
  string channel_id = 2;
  string state = 3;
  int64 accepted_at_ms = 4;
  int64 updated_at_ms = 5;
  string error = 6;
}

message EditMessageRequest {
  string channel_id = 1;
  string target_id = 2;
  string message_id = 3;
  string content = 4;
  string state = 5;
  map<string, string> metadata = 6;
  ProgressSnapshot progress = 7;
}

message EditMessageResponse {
  string message_id = 1;
  string state = 2;
}

message SendPlaceholderRequest {
  string channel_id = 1;
  string target_id = 2;
  string reply_to_message_id = 3;
  string content = 4;
}

message SendPlaceholderResponse {
  string message_id = 1;
}

message StartTypingRequest {
  string channel_id = 1;
  string target_id = 2;
}

message StartTypingResponse {
  string action_id = 1;
}

message StopTypingRequest {
  string action_id = 1;
}
message StopTypingResponse {
  bool stopped = 1;
}

message ReactToMessageRequest {
  string channel_id = 1;
  string target_id = 2;
  string message_id = 3;
  string reaction = 4;
}

message ReactToMessageResponse {
  string action_id = 1;
}

message ReactionActionRequest {
  string action_id = 1;
}

message ReactionActionResponse {
  bool applied = 1;
}

message StartStreamingMessageRequest {
  string channel_id = 1;
  string target_id = 2;
  string reply_to_message_id = 3;
  string content = 4;
}

message StartStreamingMessageResponse {
  string message_id = 1;
}

message UpdateStreamingMessageRequest {
  string channel_id = 1;
  string target_id = 2;
  string message_id = 3;
  string content = 4;
}

message UpdateStreamingMessageResponse {
  bool updated = 1;
}

message FinishStreamingMessageRequest {
  string channel_id = 1;
  string target_id = 2;
  string message_id = 3;
  string content = 4;
}

message FinishStreamingMessageResponse {
  bool finished = 1;
}

message MediaPart {
  string type = 1;
  string ref = 2;
  string caption = 3;
  string filename = 4;
  string content_type = 5;
}

message SubscribeInboundRequest {
  repeated string channel_ids = 1;
}

message SubscribeInboundResponse {
  InboundMessage message = 1;
}

message InboundMessage {
  string channel_id = 1;
  string message_id = 2;
  string chat_id = 3;
  string sender_id = 4;
  string sender_name = 5;
  string content = 6;
  map<string, string> metadata = 7;
  int64 received_at_ms = 8;
  repeated MediaPart media = 9;
  SenderInfo sender = 10;
  Peer peer = 11;
  string session_key = 12;
  string media_scope = 13;
}

message SenderInfo {
  string platform = 1;
  string platform_id = 2;
  string canonical_id = 3;
  string username = 4;
  string display_name = 5;
  string avatar_url = 6;
}

message Peer {
  string kind = 1;
  string id = 2;
}

message ProgressSnapshot {
  string status = 1;
  string phase = 2;
  string preview = 3;
  string model = 4;
  int32 iteration = 5;
  int32 omitted = 6;
  int64 elapsed_ms = 7;
  string updated_at = 8;
  repeated ProgressStep steps = 9;
}

message ProgressStep {
  string id = 1;
  string kind = 2;
  string status = 3;
  string title = 4;
  string summary = 5;
  string detail = 6;
  string tool = 7;
  int32 iteration = 8;
  int64 duration_ms = 9;
}

message UploadMediaRequest {
  string filename = 1;
  string content_type = 2;
  bytes content = 3;
}

message UploadMediaResponse {
  MediaPart media = 1;
}

message DownloadMediaRequest {
  string ref = 1;
}

message DownloadMediaResponse {
  string filename = 1;
  string content_type = 2;
  bytes content = 3;
}

message ReleaseMediaRequest { string ref = 1; }
message ReleaseMediaResponse { bool released = 1; }

message RegisterCommandsRequest {
  string channel_id = 1;
  repeated CommandDefinition commands = 2;
}

message RegisterCommandsResponse {
  string channel_id = 1;
  bool registered = 2;
  int32 command_count = 3;
  string state = 4;
  string reason = 5;
}

message CommandDefinition {
  string name = 1;
  string description = 2;
  string usage = 3;
  repeated string aliases = 4;
  repeated CommandSubcommand subcommands = 5;
}

message CommandSubcommand {
  string name = 1;
  string description = 2;
  string args_usage = 3;
}
