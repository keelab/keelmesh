syntax = "proto3";

package gate.v1;

option go_package = "github.com/keelab/keelmesh/gen/gate/v1;gatev1";

// ChannelGateService is the private service boundary between ChannelCore and
// GateCore. It exposes transport-neutral channel data without copying
// GateCore's internal task model into the edge service.
service ChannelGateService {
  rpc IngestInbound(IngestInboundRequest) returns (DispatchResponse);
  rpc AuthorizeOutbound(AuthorizeOutboundRequest) returns (AuthorizeOutboundResponse);
  rpc DispatchTask(DispatchTaskRequest) returns (DispatchResponse);
  rpc GetTask(GetTaskRequest) returns (TaskStatusResponse);
  rpc ResumeTask(ResumeTaskRequest) returns (DispatchResponse);
  rpc ApproveTask(ApproveTaskRequest) returns (DispatchResponse);
  rpc CancelTask(CancelTaskRequest) returns (DispatchResponse);
  rpc ProjectTaskEvent(ProjectTaskEventRequest) returns (ProjectTaskEventResponse);
}

message IngestInboundRequest {
  string request_id = 1;
  string channel_id = 2;
  string message_id = 3;
  string target_id = 4;
  string sender_id = 5;
  string sender_name = 6;
  string content = 7;
  map<string, string> metadata = 8;
  repeated MediaRef media = 9;
  int64 received_at_ms = 10;
}

message AuthorizeOutboundRequest {
  string request_id = 1;
  string task_id = 2;
  string agent_id = 3;
  string channel_id = 4;
  string target_id = 5;
  string message_id = 6;
  string content = 7;
  map<string, string> metadata = 8;
  repeated MediaRef media = 9;
}

message DispatchTaskRequest {
  string request_id = 1;
  string task_id = 2;
  string channel_id = 3;
  string target_id = 4;
  string content = 5;
  map<string, string> metadata = 6;
  bool require_approval = 7;
  int32 max_attempts = 8;
  int64 max_wall_time_ms = 9;
}

message GetTaskRequest {
  string task_id = 1;
}

message TaskStatusResponse {
  string task_id = 1;
  string channel_id = 2;
  string target_id = 3;
  string state = 4;
  string error = 5;
  string result_content = 6;
  string progress_content = 7;
  string progress_state = 8;
}

message ResumeTaskRequest {
  string task_id = 1;
  string reason = 2;
}

message ApproveTaskRequest {
  string task_id = 1;
  string reason = 2;
}

message CancelTaskRequest {
  string task_id = 1;
  string reason = 2;
}

message DispatchResponse {
  string request_id = 1;
  string task_id = 2;
  string state = 3;
  bool accepted = 4;
  string reason = 5;
}

message AuthorizeOutboundResponse {
  string request_id = 1;
  string task_id = 2;
  string agent_id = 3;
  bool allowed = 4;
  string reason = 5;
  map<string, string> metadata = 6;
}

message ProjectTaskEventRequest {
  string task_id = 1;
  string event_id = 2;
  int64 sequence = 3;
  string state = 4;
  string content = 5;
  string error = 6;
  string progress_state = 7;
  string progress_content = 8;
}

message ProjectTaskEventResponse {
  bool applied = 1;
  bool duplicate = 2;
  string state = 3;
  int64 sequence = 4;
  string reason = 5;
}

message MediaRef {
  string type = 1;
  string ref = 2;
  string caption = 3;
  string filename = 4;
  string content_type = 5;
}
